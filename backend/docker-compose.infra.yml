# Mongo + Redis only, for local `npm run dev` and the e2e tests.
services:
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongo:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
volumes:
  mongo:
